name: Validate Python
on:
  pull_request:
  push:
    branches: [feature/competitive-tools]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot files
        run: python -m py_compile bot.py new_features.py
